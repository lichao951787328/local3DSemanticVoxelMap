# Raw grid cloud produced upstream of view_point_cloud.
input_topic: /grids_points
# Accumulate in a stable frame. This requires map <- wuba_base TF at each
# incoming cloud timestamp.
global_frame: map
# Capture global_frame <- wuba_base at the first successfully transformed cloud.
# Voxel storage then uses map_start, where that first robot pose is the origin.
use_initial_pose_reference: true
reference_frame: map_start
local_cost_frame: wuba_base
publish_local_cost_cloud: true
# The filtered admission snapshot is expressed in the robot frame at the input
# cloud acquisition time. It keeps the local map's native 0.10 m voxel centers.
global_admission_output_frame: wuba_base
global_admission_exclude_dynamic: true
# Direct SSMI-ready output. Both bag and simulation profiles publish the same
# canonical semantic encoding on this interface.
publish_ssmi_admitted_cloud: true
ssmi_admitted_topic: /semantic_pcl/global_admitted
ssmi_obstacle_traversability_threshold: 0.75
# /grids_points is an already-processed grid rather than a raw range scan, so
# only direct, confident low-cost terrain contradiction may revoke an old SSMI
# obstacle. Missing grid cells are deliberately not treated as free space.
enable_ssmi_obstacle_revocation: true
ssmi_revocation_voxel_size: 0.10
ssmi_revocation_minimum_free_frames: 5
ssmi_revocation_minimum_free_duration: 0.5
ssmi_revocation_free_max_traversability: 0.45
ssmi_revocation_minimum_semantic_confidence: 0.60
ssmi_revocation_ray_evidence_enabled: false
ssmi_revocation_ray_endpoint_margin: 0.20
ssmi_revocation_ray_point_stride: 2
# /grids_points already carries measured traversability; do not replace it with
# semantic-only terrain geometry inference.
terrain_height_cost_enabled: false
input_layout: point_cloud
point_stride: 1

# Field names are taken from view_point_cloud's registered PCL point type.
semantic_field: semantic_lable  # Keep the upstream spelling for compatibility.
# Explicitly clear a packed-RGB remap left on the ROS parameter server when
# switching from the simulation profile without restarting roscore.
semantic_label_remap: []
confidence_field: semantic_confidence  # Optional; defaults to the value below.
cost_field: traversability
default_semantic_confidence: 1.0
transform_timeout: 0.2
timing_report_frames: 50

# Sparse local map. /grids_points is already sampled on an approximately 0.1 m grid.
voxel_size_xy: 0.10
voxel_size_z: 0.10
decay_seconds: 0.5
max_voxels: 300000
# Optional spherical sensor outlier filter. <= 0 disables it. The local box
# below already bounds every accepted point, so it is disabled for this setup.
max_range: -1.0
min_z: -2.0
max_z: 4.0
# Rolling cuboid in the incoming cloud frame (wuba_base here). It follows both
# the robot position and orientation. Bounds may be asymmetric to retain more
# space in front than behind. local_radius remains as a backward-compatible
# spherical alternative and is ignored while local_box_enabled is true.
local_radius: -1.0
local_box_enabled: true
local_box_min_x: -2.0
local_box_max_x: 10.0
local_box_min_y: -5.0
local_box_max_y: 5.0
local_box_min_z: -2.0
local_box_max_z: 4.0
# The recorded /grids_points pipeline is already preprocessed; keep the
# simulation-specific robot self-filter disabled for this input profile.
robot_body_exclusion_enabled: false

# Compact Top-3 semantic evidence.
semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

# Preserve measured and semantic costs independently. Semantics may only raise
# geometric risk, scaled by the voxel's semantic confidence:
# final = measured + alpha * confidence * max(0, semantic - measured).
unknown_cost: 0.50
traversability_fusion_method: confidence_weighted_raise
semantic_risk_alpha: 0.80
semantic_cost_weight: 0.0  # Used only when fusion method is weighted_average.
cost_rise_alpha: 0.70
cost_fall_alpha: 0.15

# Cityscapes-style IDs and colors used in view_point_cloud/src/main.cpp.
# Costs are navigation policy and can be tuned for the robot, independently of color.
semantic_classes:
  - {label: 0,  name: road,          color: [128, 64, 128],  cost: 0.05}
  - {label: 1,  name: sidewalk,      color: [244, 35, 232],  cost: 0.20}
  - {label: 2,  name: building,      color: [70, 70, 70],    cost: 1.00}
  - {label: 3,  name: wall,          color: [102, 102, 156], cost: 1.00}
  - {label: 4,  name: fence,         color: [190, 153, 153], cost: 1.00}
  - {label: 5,  name: pole,          color: [153, 153, 153], cost: 1.00}
  - {label: 6,  name: traffic_light, color: [250, 170, 30],  cost: 1.00}
  - {label: 7,  name: traffic_sign,  color: [220, 220, 0],   cost: 1.00}
  - {label: 8,  name: vegetation,    color: [107, 142, 35],  cost: 0.85}
  - {label: 9,  name: terrain,       color: [152, 251, 152], cost: 0.35}
  - {label: 10, name: sky,           color: [70, 130, 180],  cost: 1.00}
  - {label: 11, name: person,        color: [220, 20, 60],   cost: 1.00}
  - {label: 12, name: rider,         color: [255, 0, 0],     cost: 1.00}
  - {label: 13, name: car,           color: [0, 0, 142],     cost: 1.00}
  - {label: 14, name: truck,         color: [0, 0, 70],      cost: 1.00}
  - {label: 15, name: bus,           color: [0, 60, 100],    cost: 1.00}
  - {label: 16, name: train,         color: [0, 80, 100],    cost: 1.00}
  - {label: 17, name: motorcycle,    color: [0, 0, 230],     cost: 1.00}
  - {label: 18, name: bicycle,       color: [119, 11, 32],   cost: 1.00}

publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/grids_points_voxel_map.csv
