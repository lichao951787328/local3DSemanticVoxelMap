# Input and coordinate frame
input_topic: /semantic_pcl/semantic_pcl
global_frame: world
use_initial_pose_reference: true
reference_frame: map_start
publish_local_cost_cloud: false
# Simulation robot body frame used by the local admission snapshot.
global_admission_output_frame: base_link
global_admission_exclude_dynamic: true
# This source has no traversability field. On terrain labels 0/1/9, mark both
# sides of a local height discontinuity as obstacles. The 0.20 m neighborhood
# bridges the narrow invalid band created by the depth-edge filter.
terrain_height_cost_enabled: true
terrain_height_difference_threshold: 0.15
terrain_height_neighborhood_radius: 0.20
terrain_height_obstacle_cost: 1.0
input_layout: image
point_stride: 1
semantic_field: semantic_color       # SSMI packed RGB stored as FLOAT32 bits
confidence_field: semantic_confidence # optional; default below if absent
cost_field: traversability           # optional direct cost in [0, 1]
default_semantic_confidence: 1.0
transform_timeout: 0.2

# SSMI publishes the 640x480 image as a flattened 307200-point cloud. With the
# stride below, sample 213x160 = 34080 pixels before transforming points.
input_image_width: 640
input_image_height: 480
pixel_stride_x: 3
pixel_stride_y: 3
pixel_offset_x: 2
pixel_offset_y: 2
timing_report_frames: 50  # report map-update avg/min/max every N input frames

# Sparse local voxel map
voxel_size: 0.10
decay_seconds: 0.5       # current depth stamp - voxel's last-hit depth stamp
max_voxels: 500000
max_range: 15.0          # <= 0 disables the input range limit
min_z: -2.0
max_z: 4.0
local_radius: 20.0       # <= 0 disables spatial pruning
local_box_enabled: false

# The simulation palette is normalized to the same canonical IDs used by the
# recorded /grids_points pipeline, so local admission has identical label rules.
semantic_label_remap:
  - {from: "0x000000", to: 0}   # floor/background -> traversable terrain
  - {from: "0x808080", to: 2}   # structure -> static candidate
  - {from: "0x0000ff", to: 3}   # low obstacle -> static candidate
  - {from: "0xff00ff", to: 11}  # dynamic obstacle -> dynamic

# SSMI-inspired Top-3 semantic evidence fusion
semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

# Traversability: 0 is easy/safe, 1 is impassable/dangerous.
unknown_cost: 0.50
semantic_cost_weight: 0.80
traversability_fusion_method: weighted_average
cost_rise_alpha: 0.65
cost_fall_alpha: 0.15

# Classes below use canonical IDs after semantic_label_remap while preserving
# the original simulation colors in voxel_cloud.rgb and RViz.
semantic_classes:
  - {label: 0,  name: floor_or_background, color: [80, 180, 80],    cost: 0.05}
  - {label: 2,  name: structure,           color: [128, 128, 128],  cost: 0.95}
  - {label: 3,  name: low_obstacle,        color: [0, 0, 255],      cost: 0.85}
  - {label: 11, name: dynamic_obstacle,    color: [255, 0, 255],    cost: 1.00}

# RViz and persistence
publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/local3d_semantic_voxel_map.csv
